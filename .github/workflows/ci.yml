name: CI Backend

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dbname
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Validações de Estrutura (Alembic)
      env:
        DATABASE_URL: "postgresql+psycopg2://user:password@localhost:5432/dbname"
      run: |
        cd backend
        alembic upgrade head

    - name: Run Pytest
      env:
        DATABASE_URL: "postgresql+psycopg2://user:password@localhost:5432/dbname"
      run: |
        cd backend
        pytest -v

    - name: Validação de Conjunto (Modelo + Manifesto + Readiness)
      run: |
        cd backend
        python -c "import logging; logging.basicConfig(level=logging.INFO); from api.inferencia import carregar_bundle_stacking; carregar_bundle_stacking(); print('Modelo validado como conjunto único!')"
